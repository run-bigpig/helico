name: Helico macOS native Agent workflows

on:
  push:
    branches: [ci/native-macos-check]
    paths: [.github/workflows/native-macos-agent-cli.yml]

permissions:
  contents: write # The native Go inputs are held in a draft release.

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
            claude: darwin-x64
            claude_sha256: 3439427bfce962fddcf557c5a058ca914fa63e06fee894f8e12a3f10e04d1871
            codex: x86_64
            codex_sha256: 10a0972a1535206305e7b0ce2b096ddb4253542b4ac1599265b2d0c0898d278a
          - runner: macos-15
            arch: arm64
            claude: darwin-arm64
            claude_sha256: 1f04c69e1c24e4d0a716a863af0aad8fc64d49a499334c29701f073700276b99
            codex: aarch64
            codex_sha256: bd121f8abd6b28b3fc476da04a348e25a83e89eda19d39107f68f8e966053092
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fetch native Go inputs
        id: fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir programs evidence
          input="helico-macos-approval-$ARCH.tar.gz"
          dsh="helico-macos-dsh-$ARCH.test"
          gh release download ci-native-macos-check -R "$GITHUB_REPOSITORY" \
            -p "$input" -p helico-macos-approval-sha256.txt \
            -p "$dsh.gz" -p verify-claude-macos-handoff.mjs -p helico-macos-agent-followup-sha256.txt
          awk -v f="$input" '$2 == f' helico-macos-approval-sha256.txt | shasum -a 256 -c -
          awk -v f="$dsh.gz" '$2 == f || $2 == "verify-claude-macos-handoff.mjs"' helico-macos-agent-followup-sha256.txt | shasum -a 256 -c -
          tar -xzf "$input" -C programs
          gzip -dc "$dsh.gz" > "programs/helico-dsh-tests"
          chmod 755 "programs/helico-dsh-tests"
      - name: Exercise the native OpenCode ACP session and fork
        if: steps.fixtures.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          platform_arch="$ARCH"
          if test "$ARCH" = amd64; then platform_arch=x64; fi
          package="@opencode/cli-darwin-$platform_arch"
          npm install --prefix opencode --no-save --ignore-scripts --no-audit --no-fund "$package@2.1.1"
          export HELICO_TEST_OPENCODE_BINARY="$RUNNER_TEMP/opencode/node_modules/$package/bin/opencode"
          version=$("$HELICO_TEST_OPENCODE_BINARY" --version)
          test "$version" = 'opencode v2.1.1'
          programs/helico-core-tests -test.v -test.count=1 -test.timeout=10m \
            -test.run '^TestOpenCodeNative(Session|ConversationFork)$' 2>&1 | tee evidence/opencode.txt
          test "$(grep -c '^--- PASS: TestOpenCodeNative' evidence/opencode.txt)" -eq 2
      - name: Exercise native Claude Code against the local provider
        if: always() && steps.fixtures.outcome == 'success'
        env:
          CLAUDE_PLATFORM: ${{ matrix.claude }}
          CLAUDE_SHA256: ${{ matrix.claude_sha256 }}
          GH_TOKEN: ${{ github.token }}
          CODEX_ARCH: ${{ matrix.codex }}
          CODEX_HASH: ${{ matrix.codex_sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir claude-bin codex-bin
          url="https://downloads.claude.ai/claude-code-releases/2.1.301/$CLAUDE_PLATFORM/claude"
          curl --fail --show-error --silent --location --retry 3 --max-time 180 "$url" -o claude-bin/claude
          printf '%s  %s\n' "$CLAUDE_SHA256" claude-bin/claude | shasum -a 256 -c -
          chmod 755 claude-bin/claude
          codex="codex-$CODEX_ARCH-apple-darwin"
          gh release download rust-v0.172.0 -R openai/codex -p "$codex.tar.gz"
          printf '%s  %s\n' "$CODEX_HASH" "$codex.tar.gz" | shasum -a 256 -c -
          tar -xzf "$codex.tar.gz"
          install -m 755 "$codex" codex-bin/codex
          status=0
          if ! node verify-claude-macos-handoff.mjs claude-bin/claude programs codex-bin/codex --missing-sessions --model-providers 2>&1 | tee evidence/claude-handoff.txt; then status=1; fi
          if ! node verify-claude-macos-handoff.mjs claude-bin/claude programs --background-stop 2>&1 | tee evidence/claude-background.txt; then status=1; fi
          exit "$status"
      - name: Exercise Antigravity installation through the Go daemon
        if: always() && steps.fixtures.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          HELICO_TEST_ANTIGRAVITY_DOWNLOAD=1 programs/helico-core-tests -test.v -test.count=1 -test.timeout=10m -test.run '^TestAntigravityNativeInstallFromTerminal$' 2>&1 | tee evidence/antigravity-install.txt
          grep -q '^--- PASS: TestAntigravityNativeInstallFromTerminal' evidence/antigravity-install.txt
          export HELICO_TEST_ANTIGRAVITY_DATA="$RUNNER_TEMP/antigravity-data"
          programs/helico-helper install-antigravity --home "$HELICO_TEST_ANTIGRAVITY_DATA"
          programs/helico-core-tests -test.v -test.count=1 -test.timeout=4m -test.run '^TestAntigravityNativeRuntime$' 2>&1 | tee evidence/antigravity-runtime.txt
          grep -q '^--- PASS: TestAntigravityNativeRuntime' evidence/antigravity-runtime.txt
      - name: Exercise the DSH ACP session and catalog
        if: always() && steps.fixtures.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npm install --prefix dsh --no-save --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.3
          export HELICO_TEST_DSH_BINARY="$RUNNER_TEMP/dsh/node_modules/.bin/dsh"
          tests='DSHNativeCatalogKeepsProbeSessionsPrivate|DSHNativeReadOnlySession'
          programs/helico-dsh-tests -test.v -test.count=1 -test.timeout=6m -test.run "^Test($tests)$" 2>&1 | tee evidence/dsh.txt
          test "$(grep -c '^--- PASS: TestDSH' evidence/dsh.txt)" -eq 2
      - name: Keep native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-agent-cli-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          retention-days: 14
