name: Helico installed macOS Git and desktop controls

on:
  push:
    branches: [ci/native-macos-check]
    paths: [.github/workflows/native-macos-desktop-controls.yml]

permissions:
  contents: write # The acceptance inputs are held in a draft release.

jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Assemble the acceptance payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="desktop-$ARCH.tar.gz"
          input="helico-macos-approval-$ARCH.tar.gz"
          packager="retry-packager-$ARCH"
          repack="repack-$ARCH"
          desktop="helico-macos-controls-brand-$ARCH.gz"
          assets=("$base" desktop-sha256.txt "$packager" native-test-sha256.txt "$repack" repack-sha256.txt remote-sha256.txt
            "$input" helico-macos-approval-sha256.txt "$desktop" helico-macos-controls-brand-sha256.txt)
          patterns=()
          for asset in "${assets[@]}"; do patterns+=(-p "$asset"); done
          gh release download ci-native-macos-check -R "$GITHUB_REPOSITORY" "${patterns[@]}"
          awk -v f="$base" '$2 == f' desktop-sha256.txt | shasum -a 256 -c -
          awk -v f="$repack" '$2 == f' repack-sha256.txt | shasum -a 256 -c -
          awk -v f="$packager" '$2 == f' native-test-sha256.txt | shasum -a 256 -c -
          awk -v f="$input" '$2 == f' helico-macos-approval-sha256.txt | shasum -a 256 -c -
          awk -v f="$desktop" '$2 == f' helico-macos-controls-brand-sha256.txt | shasum -a 256 -c -
          tar -xzf "$base"
          mkdir fresh
          tar -xzf "$input" -C fresh
          payload="macos-$ARCH-payload"
          for program in helico helico-core helico-daemon helico-helper helico-channel-gateway helico-mcp; do
            install -m 755 "fresh/$program" "$payload/$program"
          done
          gzip -dc "$desktop" > "$payload/helico"
          mkdir -p "$payload/remote" build/macos
          install -m 644 fresh/helico.png build/macos/helico.png
          deb=helico-0.22.0-beta.2-linux-amd64.deb
          gh release download v0.22.0-beta.2 -R "$GITHUB_REPOSITORY" -p "$deb" -p SHA256SUMS
          awk -v f="$deb" '$2 == f' SHA256SUMS | shasum -a 256 -c -
          ar -p "$deb" data.tar.gz | tar -xOzf - ./usr/lib/helico/payload.tar | tar -xf - ./remote
          chmod 755 "$repack" "$packager"
          for remote_arch in amd64 arm64; do
            "./$repack" "remote/linux-$remote_arch" "$payload/remote/linux-$remote_arch.tar.gz"
          done
          (cd "$payload/remote" && shasum -a 256 -c "$RUNNER_TEMP/remote-sha256.txt")
      - name: Build the DMG and install the app
        id: package
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "./retry-packager-$ARCH" -arch "$ARCH" -payload "macos-$ARCH-payload" -out dmg -version 0.22.0-beta.2
          mkdir -p mount installed evidence
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/mount" dmg/*.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/mount" || hdiutil detach -force "$RUNNER_TEMP/mount"' EXIT
          ditto mount/helico.app installed/helico.app
          codesign --verify --deep --strict installed/helico.app
      - name: Prepare the desktop controls fixtures
        id: fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tests="helico-macos-native-input-r12-$ARCH.test"
          tests_hashes=helico-macos-native-input-r12-sha256.txt
          native_input=helico-macos-native-input-r10.swift
          native_input_hashes=helico-macos-notification-agents-sha256.txt
          native_drop=helico-macos-native-drop-r4.swift
          source=helico-native-desktop-controls-r7.tar.gz
          gh release download ci-native-macos-check -R "$GITHUB_REPOSITORY" \
            -p "$source" -p helico-native-desktop-controls-r7-sha256.txt \
            -p "$tests.gz" -p "$native_input" -p "$native_drop" -p "$tests_hashes" -p "$native_input_hashes"
          shasum -a 256 -c helico-native-desktop-controls-r7-sha256.txt
          awk -v tests="$tests.gz" '$2 == tests' "$tests_hashes" | shasum -a 256 -c -
          shasum -a 256 -c "$native_input_hashes"
          mkdir controls-fixture
          tar -xzf "$source" -C controls-fixture
          gzip -dc "$tests.gz" > controls-tests
          chmod 755 controls-tests
      - name: Build the native keyboard and pasteboard driver
        id: native-input
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -o pipefail
          swiftc "$RUNNER_TEMP/helico-macos-native-input-r10.swift" -o "$RUNNER_TEMP/native-input" \
            2>&1 | tee "$RUNNER_TEMP/evidence/native-input-driver.txt"
      - name: Open the exact conversation from a system notification
        if: always() && steps.native-input.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          app="$RUNNER_TEMP/installed/helico.app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          export HELICO_TEST_MAC_BRIDGE_WAILS="$app/Contents/MacOS/helico"
          export HELICO_TEST_MAC_KEYBOARD="$RUNNER_TEMP/native-input"
          if ! ./controls-tests -test.v -test.count=1 -test.timeout=90s \
            -test.run '^TestWailsDarwinNotification$' 2>&1 | tee evidence/notification.txt; then
            log show --last 2m --style compact --predicate \
              'process == "usernoted" AND eventMessage CONTAINS[c] "dev.helico.desktop"' \
              > evidence/notification-system.txt 2>&1 || true
            exit 1
          fi
          grep -q '^--- PASS: TestWailsDarwinNotification' evidence/notification.txt
      - name: Verify native Chromium shortcuts and live rebinding
        if: always() && steps.native-input.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          export HELICO_TEST_BROWSER_HANDOFF_WAILS="$RUNNER_TEMP/installed/helico.app/Contents/MacOS/helico"
          export HELICO_TEST_MAC_KEYBOARD="$RUNNER_TEMP/native-input"
          ./controls-tests -test.v -test.count=1 -test.timeout=2m \
            -test.run '^TestWailsDarwinBrowserShortcuts$' 2>&1 | tee evidence/browser-shortcuts.txt
          grep -q '^--- PASS: TestWailsDarwinBrowserShortcuts' evidence/browser-shortcuts.txt
      - name: Paste Unicode and PNG and read the copied PNG from NSPasteboard
        if: always() && steps.native-input.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          export HELICO_TEST_MAC_BRIDGE_WAILS="$RUNNER_TEMP/installed/helico.app/Contents/MacOS/helico"
          export HELICO_TEST_MAC_KEYBOARD="$RUNNER_TEMP/native-input"
          ./controls-tests -test.v -test.count=1 -test.timeout=90s \
            -test.run '^TestWailsDarwinComposerClipboard$' 2>&1 | tee evidence/composer-clipboard.txt
          grep -q '^--- PASS: TestWailsDarwinComposerClipboard' evidence/composer-clipboard.txt
      - name: Verify branded English and Chinese AppKit menus
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          export HELICO_TEST_MENU_WAILS="$RUNNER_TEMP/installed/helico.app/Contents/MacOS/helico"
          ./controls-tests -test.v -test.count=1 -test.timeout=90s \
            -test.run '^TestWailsAppKitMenuLanguages$' 2>&1 | tee evidence/app-menu.txt
          grep -q '^--- PASS: TestWailsAppKitMenuLanguages' evidence/app-menu.txt
      - name: Drop native files and read the saved PNG through Go core
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          swiftc helico-macos-native-drop-r4.swift -o native-drop 2>&1 | tee evidence/drop-driver.txt
          export HELICO_TEST_MAC_BRIDGE_WAILS="$RUNNER_TEMP/installed/helico.app/Contents/MacOS/helico"
          export HELICO_TEST_MAC_FILE_DROP="$RUNNER_TEMP/native-drop"
          ./controls-tests -test.v -test.count=1 -test.timeout=90s \
            -test.run '^TestWailsDarwinFileDrop$' 2>&1 | tee evidence/file-drop.txt
          grep -q '^--- PASS: TestWailsDarwinFileDrop' evidence/file-drop.txt
      - name: Compose with native Pinyin and restore both drafts after restart
        if: always() && steps.native-input.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          export HELICO_TEST_MAC_BRIDGE_WAILS="$RUNNER_TEMP/installed/helico.app/Contents/MacOS/helico"
          export HELICO_TEST_MAC_KEYBOARD="$RUNNER_TEMP/native-input"
          ./controls-tests -test.v -test.count=1 -test.timeout=2m \
            -test.run '^TestWailsDarwinComposerIME$' 2>&1 | tee evidence/composer-ime.txt
          grep -q '^--- PASS: TestWailsDarwinComposerIME' evidence/composer-ime.txt
      - name: Keep macOS desktop input logs
        if: always() && steps.fixture.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-input-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/evidence/native-input-driver.txt
            ${{ runner.temp }}/evidence/notification.txt
            ${{ runner.temp }}/evidence/notification-system.txt
            ${{ runner.temp }}/evidence/browser-shortcuts.txt
            ${{ runner.temp }}/evidence/composer-clipboard.txt
            ${{ runner.temp }}/evidence/app-menu.txt
            ${{ runner.temp }}/evidence/drop-driver.txt
            ${{ runner.temp }}/evidence/file-drop.txt
            ${{ runner.temp }}/evidence/composer-ime.txt
          if-no-files-found: error
          retention-days: 14
      - name: Verify Chromium bounds, focus, occlusion and window handoff
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          export HELICO_TEST_BROWSER_HANDOFF_WAILS="$RUNNER_TEMP/installed/helico.app/Contents/MacOS/helico"
          ./controls-tests -test.v -test.count=1 -test.timeout=3m \
            -test.run '^TestWailsBrowserHandoff$' 2>&1 | tee evidence/browser-presentation.txt
          grep -q '^--- PASS: TestWailsBrowserHandoff' evidence/browser-presentation.txt
      - name: Restore, switch and dock the detached Git window
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          programs="$RUNNER_TEMP/installed/helico.app/Contents/MacOS"
          node controls-fixture/testdata/desktop/verify-git-manager.mjs "$programs" "$programs/helico" /usr/bin/git \
            2>&1 | tee evidence/git.txt
      - name: Verify native file and bookmark choosers
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          swiftc controls-fixture/testdata/desktop/choose-dialog-macos.swift -o choose-dialog 2>&1 | tee evidence/chooser-build.txt
          app="$RUNNER_TEMP/installed/helico.app/Contents/MacOS/helico"
          export HELICO_TEST_MAC_BRIDGE_WAILS="$app" HELICO_TEST_BOOKMARKS_WAILS="$app"
          export HELICO_TEST_MAC_FILE_CHOOSER="$RUNNER_TEMP/choose-dialog" HELICO_TEST_BOOKMARKS_CHOOSER="$RUNNER_TEMP/choose-dialog"
          ./controls-tests -test.v -test.count=1 -test.timeout=5m \
            -test.run '^Test(WailsDarwinFilePickers|WailsBookmarksHTMLPicker)$' 2>&1 | tee evidence/choosers.txt
          test "$(grep -c '^--- PASS: Test' evidence/choosers.txt)" -eq 2
      - name: Verify file and backend bridges on the installed desktop
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          export HELICO_TEST_MAC_BRIDGE_WAILS="$RUNNER_TEMP/installed/helico.app/Contents/MacOS/helico"
          ./controls-tests -test.v -test.count=1 -test.timeout=2m \
            -test.run '^TestWailsDarwinDesktopBridge$' 2>&1 | tee evidence/file-backend.txt
          grep -q '^--- PASS: TestWailsDarwinDesktopBridge' evidence/file-backend.txt
      - name: Skip and restore an offered update
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          export HELICO_TEST_UPDATE_WAILS="$RUNNER_TEMP/installed/helico.app/Contents/MacOS/helico"
          ./controls-tests -test.v -test.count=1 -test.timeout=7m \
            -test.run '^TestWailsUpdatePrerelease$' 2>&1 | tee evidence/update.txt
          grep -q '^--- PASS: TestWailsUpdatePrerelease' evidence/update.txt
      - name: List the published Helico Go plugin packages through the core
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          HELICO_TEST_PLUGIN_GITHUB_RELEASES=1 ./controls-tests -test.v -test.count=1 -test.timeout=2m \
            -test.run '^TestCoreListsPublishedHelicoPluginPackages$' 2>&1 | tee evidence/plugin-release.txt
          grep -q '^--- PASS: TestCoreListsPublishedHelicoPluginPackages' evidence/plugin-release.txt
      - name: Verify Go channel recovery and isolated MCP tools
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          export HELICO_TEST_MCP_BINARY="$RUNNER_TEMP/installed/helico.app/Contents/MacOS/helico-mcp"
          ./controls-tests -test.v -test.count=1 -test.timeout=3m \
            -test.run '^TestChannel(CoreIPCAndRestart|Locked(Codex|Claude)AndProjectTools)$' 2>&1 | tee evidence/channels.txt
          test "$(grep -c '^--- PASS: TestChannel' evidence/channels.txt)" -eq 3
      - name: Verify native ZCode and model image settings
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npm install --prefix zcode --no-save --ignore-scripts --no-audit --no-fund 'zcode-app-cli@3.16.2-38'
          app="$RUNNER_TEMP/installed/helico.app/Contents/MacOS/helico"
          export HELICO_TEST_ZCODE_DIR="$RUNNER_TEMP/zcode/node_modules/.bin"
          export HELICO_TEST_ZCODE_WAILS="$app" HELICO_TEST_ZCODE_PROVIDER_WAILS="$app"
          ./controls-tests -test.v -test.count=1 -test.timeout=10m \
            -test.run '^TestZCode(NativeCatalog|NativeSessionResume|ConfiguredImageProvider)$' 2>&1 | tee evidence/zcode.txt
          test "$(grep -c '^--- PASS: TestZCode' evidence/zcode.txt)" -eq 3
      - name: Retry a stalled Cursor turn through Wails and Go daemon
        if: always() && steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          programs="$RUNNER_TEMP/installed/helico.app/Contents/MacOS"
          install -m 755 "$programs/helico-mcp" ./helico-mcp
          HELICO_TEST_CURSOR_WAILS="$programs/helico" ./controls-tests -test.v -test.count=1 -test.timeout=4m \
            -test.run '^TestCursorFirstFrameRetryThroughGoDaemon$' 2>&1 | tee evidence/cursor-retry.txt
          grep -q '^--- PASS: TestCursorFirstFrameRetryThroughGoDaemon' evidence/cursor-retry.txt
      - name: Keep native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-desktop-controls-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          retention-days: 14
